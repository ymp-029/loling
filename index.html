<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LED電光掲示板プレイヤー</title>
<style>
:root{color-scheme:dark;--bg:#0b0b0d;--fg:#e8e8ea;--mut:#8a8a92;--line:#26262c;--p:8px;--d:6px;--b:4px;--br:1.6;--mono:grayscale(0);--tint:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px}
h1{font-size:16px;margin:0;letter-spacing:.1em;color:#ffb02e}
.screen{position:relative;width:min(100%,1000px);aspect-ratio:16/9;background:#000;overflow:hidden;border:6px solid #1a1a1e;border-radius:10px}
.screen:fullscreen{width:100vw;height:100vh;aspect-ratio:auto;border:0;border-radius:0}
.screen>*{position:absolute;inset:0;width:100%;height:100%}
iframe{border:0;pointer-events:none}
.mos{backdrop-filter:blur(var(--b)) brightness(var(--br)) saturate(1.4) var(--mono);-webkit-backdrop-filter:blur(var(--b)) brightness(var(--br)) saturate(1.4) var(--mono);
-webkit-mask-image:radial-gradient(circle at center,#000 calc(var(--d)/2),transparent calc(var(--d)/2 + .8px));mask-image:radial-gradient(circle at center,#000 calc(var(--d)/2),transparent calc(var(--d)/2 + .8px));
-webkit-mask-size:var(--p) var(--p);mask-size:var(--p) var(--p)}
.sheet{background:radial-gradient(circle at center,transparent calc(var(--d)/2),#000 calc(var(--d)/2 + .8px));background-size:var(--p) var(--p)}
.tint{background:var(--tint);mix-blend-mode:multiply}
.panel{width:min(100%,1000px);display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));font-size:13px}
.panel label{display:grid;gap:4px;color:var(--mut)}
.row{display:flex;gap:8px;width:min(100%,1000px);flex-wrap:wrap}
input[type=text]{flex:1;min-width:200px;background:#141418;border:1px solid var(--line);color:var(--fg);padding:10px;border-radius:8px;font-size:14px}
button,select{background:#1c1c22;border:1px solid var(--line);color:var(--fg);padding:10px 14px;border-radius:8px;font-size:14px;cursor:pointer}
button:hover{border-color:#ffb02e}
input[type=range]{width:100%}
#msg{color:var(--mut);font-size:12px;width:min(100%,1000px)}
</style>
</head>
<body>
<h1>● LED BOARD PLAYER</h1>
<div class="screen" id="screen">
  <iframe id="yt" allow="autoplay; encrypted-media; fullscreen" title="player"></iframe>
  <div class="mos"></div>
  <div class="sheet"></div>
  <div class="tint"></div>
</div>
<div class="row">
  <input type="text" id="url" placeholder="YouTubeのURLまたは動画ID" value="https://www.youtube.com/watch?v=jfKfPfyJRdk">
  <button id="go">読み込み</button>
  <button id="pp">⏯ 再生/停止</button>
  <button id="mu">🔊 ミュート切替</button>
  <button id="fs">⛶ 全画面</button>
</div>
<div class="panel">
  <label>横のドット数 <span id="vn">120</span><input type="range" id="n" min="30" max="300" value="120"></label>
  <label>穴の大きさ <span id="vh">75</span>%<input type="range" id="h" min="30" max="98" value="75"></label>
  <label>明るさ <span id="vb">1.6</span><input type="range" id="br" min="0.8" max="3" step="0.1" value="1.6"></label>
  <label>発光色
    <select id="c"><option value="full">フルカラー</option><option value="amber">アンバー</option><option value="green">グリーン</option><option value="red">レッド</option><option value="white">白</option></select>
  </label>
</div>
<div id="msg">穴だけから映像が見える黒シートの下に、ぼかしレイヤーを敷いて1ドット1色に平均化しています。</div>
<script>
const $=id=>document.getElementById(id),S=document.documentElement.style,yt=$('yt'),sc=$('screen');
const tints={full:['#fff','grayscale(0)'],amber:['#ff9a1f','grayscale(1) contrast(1.3)'],green:['#3dff6a','grayscale(1) contrast(1.3)'],red:['#ff3b30','grayscale(1) contrast(1.3)'],white:['#fff','grayscale(1) contrast(1.3)']};
function upd(){
  const n=+$('n').value,p=sc.clientWidth/n,d=p*($('h').value/100);
  S.setProperty('--p',p+'px');S.setProperty('--d',d+'px');S.setProperty('--b',(p*.55)+'px');S.setProperty('--br',$('br').value);
  const t=tints[$('c').value];S.setProperty('--tint',t[0]);S.setProperty('--mono',t[1]);
  $('vn').textContent=n;$('vh').textContent=$('h').value;$('vb').textContent=$('br').value;
}
['n','h','br','c'].forEach(i=>$(i).addEventListener('input',upd));
new ResizeObserver(upd).observe(sc);upd();
function vid(u){const m=u.match(/(?:v=|youtu\.be\/|embed\/|shorts\/|live\/)([\w-]{11})/)||u.trim().match(/^([\w-]{11})$/);return m&&m[1]}
function load(){
  const id=vid($('url').value);
  if(!id){$('msg').textContent='URLからIDを読み取れませんでした。';return}
  yt.src='https://www.youtube.com/embed/'+id+'?autoplay=1&mute=1&controls=0&rel=0&playsinline=1&enablejsapi=1&loop=1&playlist='+id;
  playing=true;muted=true;$('msg').textContent='自動再生のため最初はミュートです。🔊ボタンで音を出せます。';
}
let playing=true,muted=true;
function cmd(f){try{yt.contentWindow.postMessage(JSON.stringify({event:'command',func:f,args:[]}),'*')}catch(e){}}
$('go').onclick=load;
$('url').addEventListener('keydown',e=>{if(e.key==='Enter')load()});
$('pp').onclick=()=>{cmd(playing?'pauseVideo':'playVideo');playing=!playing};
$('mu').onclick=()=>{cmd(muted?'unMute':'mute');muted=!muted};
$('fs').onclick=()=>{sc.requestFullscreen?sc.requestFullscreen():0};
load();
</script>
</body>
</html>
